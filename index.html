const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const $=id=>document.getElementById(id);const sections=['login','menu','game','finish'];
const show=id=>sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let unlocked=sessionStorage.getItem('alc_auth')==='1',soundOn=true,audioCtx=null,level=0,questions=[],idx=0,points=0,answered=false;
let completed=(()=>{try{return JSON.parse(localStorage.getItem('alc_completed')||'[]')}catch{return []}})();
function tone(freq,start,duration,type='sine',gain=.13){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime+start);g.gain.setValueAtTime(gain,audioCtx.currentTime+start);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+start+duration);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+start);o.stop(audioCtx.currentTime+start+duration)}catch(e){}}
function correctSound(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24,'triangle',.12))}
function wrongSound(){tone(180,0,.3,'sawtooth',.08);tone(115,.17,.36,'square',.05)}
function flash(ok){let e=document.createElement('div');e.className=ok?'celebrate':'errorFlash';if(ok){let s=document.createElement('strong');s.textContent='BRAVO!!!';e.append(s)}document.body.append(e);setTimeout(()=>e.remove(),900)}
function menu(){show('menu');$('levels').innerHTML='';LEVELS.forEach((items,i)=>{let b=document.createElement('button');b.className='level';b.disabled=i>0&&!completed.includes(i-1);b.innerHTML=`Nivel ${i+1}<small>${i<3?'Sigle auto':'Fotografii auto'} · ${completed.includes(i)?'✓ complet':'20 întrebări'}</small>`;b.onclick=()=>start(i);$('levels').append(b)});$('progressText').textContent=`Niveluri finalizate: ${completed.length} din 6.`}
function start(i){level=i;questions=shuffle(LEVELS[i]);idx=0;points=0;show('game');render()}
function render(){answered=false;let name=questions[idx];$('levelName').textContent='Nivel '+(level+1);$('counter').textContent=(idx+1)+' / 20';$('score').textContent='⭐ '+points;$('fill').style.width=(idx/20*100)+'%';$('status').textContent='';$('status').className='status';$('nextBtn').classList.add('hidden');let visual=$('visual');visual.innerHTML='';let path=(level<3?'logos':'cars')+'/'+slug(name);let data=EMBEDDED_IMAGES[path];if(data&&data.startsWith('data:image/svg+xml;base64,')){try{let raw=atob(data.split(',')[1]);let svg=new DOMParser().parseFromString(raw,'image/svg+xml').documentElement;if(svg.localName!=='svg')throw Error('SVG invalid');svg.setAttribute('role','img');svg.setAttribute('aria-label','Ilustrație pentru '+name);visual.append(document.importNode(svg,true))}catch(err){visual.textContent='Eroare de afișare a imaginii: '+name}}else{visual.textContent='Imagine indisponibilă pentru '+name}
let opts=shuffle([name,...shuffle(BRANDS.filter(x=>x!==name)).slice(0,3)]);$('answers').innerHTML='';opts.forEach(opt=>{let b=document.createElement('button');b.className='answer';b.textContent=opt;b.onclick=()=>answer(opt,name);$('answers').append(b)})}
function answer(opt,name){if(answered)return;answered=true;let ok=opt===name;if(ok){points++;correctSound()}else wrongSound();flash(ok);[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===name)b.classList.add('good');else if(b.textContent===opt)b.classList.add('bad')});$('score').textContent='⭐ '+points;$('status').textContent=ok?'BRAVO!!!':'Mai încearcă data viitoare!';$('status').className='status '+(ok?'good':'bad');$('nextBtn').textContent=idx===19?'Finalizare →':'Următoarea →';$('nextBtn').classList.remove('hidden')}
function next(){if(!answered)return;idx++;if(idx===20){if(!completed.includes(level)){completed.push(level);localStorage.setItem('alc_completed',JSON.stringify(completed))}$('finishTitle').textContent='Nivelul '+(level+1)+' complet!';$('finishScore').textContent='Ai răspuns corect la '+points+' din 20 de întrebări.';show('finish')}else render()}
$('loginForm').onsubmit=e=>{e.preventDefault();if($('password').value==='Mark2020.'){sessionStorage.setItem('alc_auth','1');unlocked=true;menu()}else $('loginError').textContent='Parolă incorectă.'};$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 Sunet':'🔇 Fără sunet';if(soundOn)tone(660,0,.15)};$('nextBtn').onclick=next;$('backBtn').onclick=menu;$('againBtn').onclick=menu;$('resetBtn').onclick=()=>{if(confirm('Ștergi progresul tuturor nivelurilor?')){completed=[];localStorage.removeItem('alc_completed');menu()}};if(unlocked)menu();
</script></body></html>
