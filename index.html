const D=JSON.parse(document.getElementById('game-data').textContent),LEVELS=D.levels,ASSETS=D.assets,SOUNDS=D.sounds,$=id=>document.getElementById(id);let level=0,q=[],idx=0,points=0,answered=false,soundOn=true,completed=JSON.parse(localStorage.getItem('alc_completed')||'[]');
const shuffle=a=>[...a].sort(()=>Math.random()-.5),show=id=>['login','menu','game','learn','done'].forEach(x=>$(x).classList.toggle('hidden',x!==id));let engineAudio=null,effectAudio=null;function stopEngine(){if(engineAudio){engineAudio.pause();engineAudio.currentTime=0;engineAudio=null}}function play(k){if(!soundOn)return;try{if(k==='start'){stopEngine();engineAudio=new Audio(SOUNDS.engine);engineAudio.loop=true;engineAudio.volume=.42;engineAudio.play().catch(()=>{})}else{if(effectAudio){effectAudio.pause();effectAudio.currentTime=0}effectAudio=new Audio(SOUNDS[k]);effectAudio.volume=k==='wrong'?.68:.78;effectAudio.play().catch(()=>{})}}catch(e){}}
function menu(){show('menu');$('levels').innerHTML='';LEVELS.forEach((items,i)=>{let b=document.createElement('button');b.className='level';b.disabled=i>0&&!completed.includes(i-1);b.innerHTML=`<strong>Nivel ${i+1}</strong><small>${'SIGLA PE MAȘINĂ'} · ${completed.includes(i)?'✓ COMPLET':'20 ÎNTREBĂRI'}</small>`;b.onclick=()=>start(i);$('levels').append(b)});$('progressText').textContent=`Ai finalizat ${completed.length} din 6 niveluri.`}
function start(i){level=i;q=shuffle(LEVELS[i]);idx=points=0;show('game');render()}function options(name){let pool=LEVELS[level].filter(x=>x!==name);return shuffle([name,...shuffle(pool).slice(0,3)])}
function render(){answered=false;let n=q[idx],kind='car';$('levelName').textContent='Nivel '+(level+1);$('counter').textContent=(idx+1)+' / 20';$('score').textContent='⭐ '+points;$('fill').style.width=(idx/20*100)+'%';$('status').textContent='';$('nextBtn').classList.add('hidden');$('visual').innerHTML=`<img src="${ASSETS[kind+':'+n]}" alt="Automobil cu sigla ${n}"><button class="zoom-btn" type="button" onclick="stopEngine();openZoom(ASSETS['car:${n}'],'${n}')">🔍 Mărește imaginea</button>`;$('answers').innerHTML='';options(n).forEach(x=>{let b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>answer(b,x,n);$('answers').append(b)});play('start')}
function answer(btn,x,n){if(answered)return;stopEngine();answered=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===n)b.classList.add('good')});if(x===n){points++;$('status').textContent='Corect! Super! 🎉';play('correct');let s=document.createElement('div');s.className='stars';s.textContent='⭐🎉⭐';document.body.append(s);setTimeout(()=>s.remove(),850)}else{btn.classList.add('bad');$('status').textContent='Mai încearcă data viitoare!';play('wrong')}$('score').textContent='⭐ '+points;$('nextBtn').classList.remove('hidden')}
function next(){if(++idx<20)render();else{if(!completed.includes(level)){completed.push(level);completed.sort();localStorage.setItem('alc_completed',JSON.stringify(completed))}play('level');$('doneText').textContent=`Ai recunoscut ${points} din 20. ${points>=16?'Ești expert auto!':'Continuă antrenamentul!'}`;show('done')}}

const ALL_BRANDS=LEVELS.flat();let learnIndex=0,zoomHistory=false;
function pronounce(name){if(!soundOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(name);u.lang='en-US';u.rate=.78;u.pitch=1.05;u.volume=1;window.speechSynthesis.speak(u)}
function startLearning(){stopEngine();learnIndex=0;show('learn');renderLearn()}
function renderLearn(){let n=ALL_BRANDS[learnIndex],src=ASSETS['car:'+n];$('learnCounter').textContent=(learnIndex+1)+' / '+ALL_BRANDS.length;$('learnBrand').textContent=n;$('learnVisual').innerHTML=`<img src="${src}" alt="${n}"><button class="zoom-btn" type="button" onclick="openZoom(ASSETS['car:${n}'],'${n}')">🔍 Mărește imaginea</button>`;setTimeout(()=>pronounce(n),220)}
function moveLearn(step){learnIndex=(learnIndex+step+ALL_BRANDS.length)%ALL_BRANDS.length;renderLearn()}
function openZoom(src,alt){$('zoomImage').src=src;$('zoomImage').alt=alt;$('zoomModal').classList.remove('hidden');if(!zoomHistory){history.pushState({zoom:true},'');zoomHistory=true}}
function closeZoom(fromHistory=false){$('zoomModal').classList.add('hidden');$('zoomImage').src='';if(zoomHistory&&!fromHistory){zoomHistory=false;history.back()}else zoomHistory=false}
window.addEventListener('popstate',()=>{if(zoomHistory)closeZoom(true)});
$('learnBtn').onclick=startLearning;$('speakBtn').onclick=()=>pronounce(ALL_BRANDS[learnIndex]);$('learnPrevBtn').onclick=()=>moveLearn(-1);$('learnNextBtn').onclick=()=>moveLearn(1);$('learnMenuBtn').onclick=menu;$('zoomClose').onclick=()=>closeZoom();$('zoomModal').onclick=e=>{if(e.target===$('zoomModal'))closeZoom()};
$('loginForm').onsubmit=e=>{e.preventDefault();if($('password').value==='Mark2020.'){sessionStorage.setItem('alc_auth','1');menu()}else $('loginError').textContent='Parolă incorectă.'};$('soundBtn').onclick=()=>{soundOn=!soundOn;if(!soundOn)stopEngine();$('soundBtn').textContent=soundOn?'🔊 Sunet':'🔇 Fără sunet'};$('nextBtn').onclick=next;$('backBtn').onclick=menu;$('againBtn').onclick=menu;$('resetBtn').onclick=()=>{if(confirm('Ștergi progresul?')){completed=[];localStorage.removeItem('alc_completed');menu()}};if(sessionStorage.getItem('alc_auth')==='1')menu();
</script></body></html>
